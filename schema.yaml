openapi: 3.0.3
info:
  title: ACS Backend API (AMR Control System)
  version: 2.1.0
  description: Hệ thống điều khiển & quản lý robot vận chuyển tự hành AMR/AGV theo
    chuẩn VDA 5050 - Khu vực CNC Prod 2G
paths:
  /api/acs/dispatch/:
    post:
      operationId: acs_dispatch_create
      description: Tạo lệnh điều xe AMR đến node hoặc vận chuyển hàng giữa 2 điểm.
      tags:
      - acs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchAMRInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DispatchAMRInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DispatchAMRInput'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/acs/find-path/:
    post:
      operationId: acs_find_path_create
      description: Tìm lộ trình tối ưu VDA 5050 giữa 2 Node sử dụng giải thuật Dijkstra
        kết hợp Cache Graph.
      tags:
      - acs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindPathInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FindPathInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FindPathInput'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/acs/log-file/:
    get:
      operationId: acs_log_file_retrieve
      description: Tra cứu nội dung file nhật ký vận hành acs_system.log.
      tags:
      - acs
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
